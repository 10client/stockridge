# =====================================================================
# worker/wrangler.toml — CLOUDFLARE INFRASTRUCTURE FOR STOCKRIDGE
# =====================================================================
# One Worker does both jobs:
#
#   * it serves /api/* from the SHARED route table in server/routes/ (the same
#     files the Node backend runs), against D1;
#   * it serves the PWA itself from ../public as static assets, with a
#     single-page-application fallback so a deep link like /sales/abc resolves
#     to index.html and the client router takes over.
#
# THE THREE THINGS A FIRST DEPLOY HAS TO GET RIGHT
#
#   1. `database_id` — it is EMPTY until `wrangler d1 create stockridge` prints
#      one. A placeholder id fails at deploy with an error that does not say so
#      plainly, which is why scripts/deploy-cloudflare.sh fills it in.
#   2. `run_worker_first = ["/api/*"]` — without it, a request to a path that
#      happens to match an asset is served from the asset store and never
#      reaches the API. /api/manifest.json is generated by the server, not a
#      file on disk, so this matters.
#   3. `migrations_dir` — D1 tracks applied migrations itself, in
#      d1_migrations, and they are the SAME .sql files the Node migrator
#      applies. There is no second schema.
#
# WHAT IS NOT HERE
#
#   * No separate implementation of any endpoint.
#   * No session store: sessions are rows in user_sessions, in D1, so a device
#     that signs in on one Worker instance is signed in on all of them.
#   * No secrets in this file. JWT_SECRET is set with `wrangler secret put`.
# =====================================================================

name = "stockridge"
main = "src/index.mjs"
compatibility_date = "2025-04-01"
# `nodejs_compat` is required because the shared code is CommonJS (require /
# module.exports). It gives the Worker `require`, `Buffer` and the node: module
# shims the shared route files expect, without pulling in a native SQLite
# binding — the storage seam is worker/src/d1.js, not better-sqlite3.
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------
# STATIC ASSETS — the PWA
# ---------------------------------------------------------------------
[assets]
directory = "../public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ---------------------------------------------------------------------
# D1 — the database
#
# The id is filled in by scripts/deploy-cloudflare.sh after the database is
# created. Setting up by hand:
#
#   npx wrangler d1 create stockridge
#   npx wrangler d1 migrations apply stockridge --config worker/wrangler.toml --remote
#   node tools/d1-seed.js --print-sql | npx wrangler d1 execute stockridge --remote --file=-
# ---------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "stockridge"
database_id = "32aa519c-a7fb-41d5-bc5b-083d0a0489bc"
# The migrations are the Node ones, verbatim. One schema, two runtimes.
migrations_dir = "../schema/migrations"

# ---------------------------------------------------------------------
# VARS
#
# Deliberately minimal. Anything a shop might want to change — VAT rate, staff
# permissions, receipt footer, plan limits — is a ROW in client_settings that an
# owner edits in the app, not an environment variable that needs a redeploy.
# ---------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
DB_NAME = "stockridge"

# ---------------------------------------------------------------------
# OBSERVABILITY
#
# Logs are on because the alternative during an incident is guessing. There is
# no customer data in them: the Worker logs the method, the path, the status and
# the duration, and nothing else.
# ---------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

# ---------------------------------------------------------------------
# CRON — housekeeping that must not depend on somebody opening a screen
#
# 01:15 UTC is 02:15 in Lagos/Abuja (WAT = UTC+1): after the last shop has
# closed and before the first one opens, so a session sweep never interrupts a
# sale in progress.
# ---------------------------------------------------------------------
[triggers]
crons = ["15 1 * * *"]

# ---------------------------------------------------------------------
# ENVIRONMENTS
#
# `wrangler dev` uses the defaults above against a LOCAL D1 (a SQLite file under
# .wrangler/), so a developer can work with no Cloudflare account at all.
# Staging and production differ only in the database they point at.
# ---------------------------------------------------------------------
[env.staging]
name = "stockridge-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
DB_NAME = "stockridge-staging"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "stockridge-staging"
database_id = "32aa519c-a7fb-41d5-bc5b-083d0a0489bc"   # the same database until a staging one is created
migrations_dir = "../schema/migrations"

[env.production]
name = "stockridge"
[env.production.vars]
ENVIRONMENT = "production"
DB_NAME = "stockridge"
[[env.production.d1_databases]]
binding = "DB"
database_name = "stockridge"
database_id = "32aa519c-a7fb-41d5-bc5b-083d0a0489bc"
migrations_dir = "../schema/migrations"
