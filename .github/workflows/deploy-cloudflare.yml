# =====================================================================
# .github/workflows/deploy-cloudflare.yml
# =====================================================================
# MANUAL ONLY, ON PURPOSE.
#
# This deploys to production and it can seed an administrator. A workflow that
# does that on every push to main takes the decision away from the person who
# should be making it — and the shop floor is the group that pays for a bad
# deploy at 8am.
#
# To enable it, set these repository secrets:
#
#   CLOUDFLARE_API_TOKEN    a token with Workers Scripts:Edit and D1:Edit
#   CLOUDFLARE_ACCOUNT_ID   optional, resolved from the token when absent
#
# Then: Actions → "Deploy to Cloudflare" → Run workflow.
# =====================================================================

name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment in wrangler.toml (blank = production)'
        type: choice
        options: ['', sample, staging, production]
        default: ''
      reset_pin:
        description: 'Overwrite the administrator PIN (only if it is genuinely lost)'
        type: boolean
        default: false
      dry_run:
        description: 'Everything except the deploy itself'
        type: boolean
        default: false
      verify_frontend:
        description: 'Render the deployed PWA in jsdom and check the navigation'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The same gates as CI. A deploy that skips them is a deploy nobody
      # checked, and this is the one step that can brick a shop's morning.
      - name: Audits and tests
        run: npm run verify

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ARGS=""
          # `production` is an explicit block in wrangler.toml AND the default
          # configuration; --env=production works, but blank is the truthful
          # "the default target" and is what an ordinary deploy uses.
          ENV="${{ inputs.environment }}"
          if [ -n "$ENV" ] && [ "$ENV" != "production" ]; then ARGS="$ARGS --env=$ENV"; fi
          if [ "${{ inputs.reset_pin }}" = "true" ]; then ARGS="$ARGS --reset-pin"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node tools/deploy-cloudflare.js $ARGS \
            || { echo "::error::Deployment failed — the summary above says which step."; exit 1; }

      # The deploy script proves the ROUTES. This proves the SCREEN.
      #
      # The empty-sidebar defect passed every route test, the deploy script's own
      # smoke test, and the readiness checks — because the API was healthy and the
      # sidebar was still never built. It is only visible when the frontend is
      # actually rendered. Off by default because it needs the live PIN, which is
      # a repository secret and is not available on every deployment.
      - name: Render the deployed PWA
        if: ${{ inputs.verify_frontend && !inputs.dry_run }}
        env:
          SEAT_PIN: ${{ secrets.ADMIN_PIN }}
        run: |
          if [ -z "$SEAT_PIN" ]; then
            echo "::warning::verify_frontend was requested but the ADMIN_PIN secret is not set; skipping."
            exit 0
          fi
          npm install --no-save jsdom@29.1.1 fake-indexeddb@6.2.5
          ENV="${{ inputs.environment }}"
          case "$ENV" in
            sample)    URL=https://sample.stockridge.workers.dev ;;
            staging)   URL=https://stockridge-staging.stockridge.workers.dev ;;
            *)         URL=https://stockridge.stockridge.workers.dev ;;
          esac
          # The deploy has just rotated the runtime; give the edge a moment to
          # converge before judging what it serves.
          sleep 20
          node tools/frontend-smoke.js --url="$URL" --user=admin --pin="$SEAT_PIN" \
            || { echo "::error::the deployed frontend did not render its navigation."; exit 1; }

      - name: Report
        if: always()
        run: |
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: \`${{ inputs.environment || 'production' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Production: https://stockridge.stockridge.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "- Sample: https://sample.stockridge.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "- Diagnose: https://stockridge.stockridge.workers.dev/api/diagnose" >> $GITHUB_STEP_SUMMARY
          echo "- Reset PIN: \`${{ inputs.reset_pin }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: \`${{ inputs.dry_run }}\`" >> $GITHUB_STEP_SUMMARY
