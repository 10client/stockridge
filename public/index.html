<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06382a">
  <meta name="description" content="StockRidge — stock, sales, instalments, layaway, warranty, delivery, credit and general ledger.">
  <title>StockRidge — stock, sales & accounts</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <noscript>
    <div class="noscript">
      <h1>JavaScript is required</h1>
      <p>StockRidge is a single-page point-of-sale and retail management application. Enable JavaScript in your browser settings to continue.</p>
    </div>
  </noscript>

  <!-- ================================================================= LOGIN SCREEN -->
  <div id="login" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <img id="login-logo" alt="Logo" hidden>
        <h1 id="login-product">StockRidge</h1>
        <p class="login-tagline">Stock, sales, credit and accounts</p>
      </div>

      <form id="login-form">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false" required placeholder="e.g. admin">

        <label for="login-pin">PIN</label>
        <input id="login-pin" name="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" required placeholder="••••">

        <button id="login-submit" type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <p id="login-error" class="form-error" hidden></p>
      <p id="login-lock" class="form-lock" hidden></p>

      <details id="login-demo" class="login-demo" hidden>
        <summary>Administrator access</summary>
        <table>
          <caption>Platform Administrator seat</caption>
          <thead>
            <tr><th>Account</th><th>Username</th><th>Default PIN</th></tr>
          </thead>
          <tbody>
            <tr><td>Platform Admin</td><td><code>admin</code></td><td><code>9999</code></td></tr>
          </tbody>
        </table>
      </details>

      <div class="login-footer">
        <span id="login-offline" class="offline-badge" hidden>Offline mode active</span>
        <span id="login-tz">West Africa Time (UTC+1)</span>
      </div>
    </div>
  </div>

  <!-- ================================================================= APP SHELL -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button id="nav-toggle" class="icon-btn" aria-label="Toggle navigation" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <div class="topbar-identity">
        <img id="app-logo" alt="Business Logo" hidden>
        <div>
          <strong id="app-business">—</strong>
          <span id="app-branch" class="muted">—</span>
        </div>
      </div>

      <div class="topbar-right">
        <select id="switch-business" class="switcher" aria-label="Select business" hidden></select>
        <select id="switch-branch" class="switcher" aria-label="Select branch" hidden></select>
        <button id="btn-till" class="btn btn-sm btn-warn" hidden>Open till</button>
        <span id="queue-badge" class="queue-badge" hidden></span>
        <span id="net-badge" class="net-badge net-online">Online</span>
        <span id="clock" class="clock"></span>

        <div class="user-menu">
          <button id="user-btn" class="icon-btn" aria-label="User menu" aria-expanded="false">
            <span id="user-initials">AD</span>
          </button>
          <div id="user-pop" class="popover" hidden>
            <p id="pop-name" class="popover-name">Platform Administrator</p>
            <p id="pop-role" class="popover-role">ADMIN</p>
            <div style="display: flex; justify-content: space-between; gap: .5rem; margin-top: .6rem;">
              <button id="pop-pin" type="button" class="btn btn-sm btn-ghost">Change PIN</button>
              <button id="pop-signout" type="button" class="btn btn-sm btn-danger-ghost">Sign out</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="body">
      <nav id="sidebar" class="sidebar" aria-label="Main Navigation"></nav>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
